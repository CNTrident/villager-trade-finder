plugins {
    id 'fabric-loom' version '1.17.0-alpha.5'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

def minecraftCompatibility = ['26.1': '26_1_2', '26.1.1': '26_1_2',
                              '26.1.2': '26_1_2', '26.2': '26_2', '26.3': '26_3'][minecraft_version]
if (minecraftCompatibility == null) {
    throw new GradleException("Unsupported Minecraft version: ${minecraft_version}; use -p backports for 1.20-1.21.11")
}

sourceSets {
    main {
        java.srcDir "src/compat/${minecraftCompatibility}/java"
    }
}

base {
    archivesName = "villager_trade_finder-${mod_loader}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.sourceCompatibility = JavaVersion.VERSION_25
java.targetCompatibility = JavaVersion.VERSION_25

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

loom {
    runs {
        client {
            runDir "run-fabric-trade-cycling"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        mappings file("mappings/mappings.tiny")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modCompileOnly "curse.maven:trader-cycling-570431:${trade_cycling_file_id}"
    modRuntimeOnly "curse.maven:trader-cycling-570431:${trade_cycling_file_id}"
}

processResources {
    inputs.property 'version', mod_version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'fabricloader_min', fabric_loader_version

    filesMatching('fabric.mod.json') {
        expand 'version': mod_version, 'minecraft_version': minecraft_version,
                'fabricloader_min': fabric_loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('verifyPotionArrows', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.uncraftbar.easyautocycler.PotionArrowChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    workingDir = layout.buildDirectory.dir('potion-arrow-checks').get().asFile
    doFirst { workingDir.mkdirs() }
}

// This headless harness is executed by JavaExec, not a JUnit test engine.
test {
    exclude '**/PotionArrowChecks*.class', '**/OfferUpdateChecks*.class'
}

tasks.register('verifyOfferUpdates', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.uncraftbar.easyautocycler.OfferUpdateChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

check.dependsOn verifyPotionArrows, verifyOfferUpdates

if (providers.gradleProperty('lowLatencySmoke').isPresent()) {
    apply from: 'smoke.gradle'
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact remapJar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
