name: Build Minecraft 1.20-1.21.11
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backports:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ["1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6", "1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run matching checks
        run: ./gradlew -p backports build -Pmc=${{ matrix.minecraft }} --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: villager-trade-finder-fabric-${{ matrix.minecraft }}
          path: backports/build/${{ matrix.minecraft }}/libs/*.jar
          if-no-files-found: error
